server:
  port: 8080

spring:
  application:
    name: blog-backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 30MB
  datasource:
    url: jdbc:mysql://localhost:3307/blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: blog
    password: blog123
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

blog:
  jwt:
    secret: blog-jwt-secret-key-change-in-production-2026
    expire-hours: 72
  upload:
    dir: uploads
    url-prefix: /uploads

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:blog;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
